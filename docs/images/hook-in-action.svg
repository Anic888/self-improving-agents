<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Terminal showing a blocked git commit attempt">
  <defs>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="20" y="20" width="860" height="400" rx="10" fill="url(#winGrad)" stroke="#2a2a2a" stroke-width="1"/>

  <!-- title bar -->
  <rect x="20" y="20" width="860" height="34" rx="10" fill="#262626"/>
  <rect x="20" y="44" width="860" height="10" fill="#262626"/>
  <circle cx="42"  cy="37" r="6" fill="#ff5f57"/>
  <circle cx="62"  cy="37" r="6" fill="#febc2e"/>
  <circle cx="82"  cy="37" r="6" fill="#28c840"/>
  <text x="450" y="42" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#9ca3af">~/repo — claude code</text>

  <!-- terminal body -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="14">
    <!-- prompt + bad command -->
    <text x="40" y="92" fill="#06b6d4" font-weight="600">$</text>
    <text x="60" y="92" fill="#e5e7eb">git commit </text>
    <text x="143" y="92" fill="#fbbf24">--no-verify</text>
    <text x="231" y="92" fill="#e5e7eb"> -m </text>
    <text x="265" y="92" fill="#a3e635">"skip the hook"</text>

    <!-- hook reaction -->
    <rect x="40" y="110" width="820" height="2" fill="#374151"/>

    <text x="40" y="138" fill="#ef4444" font-weight="700">✗ BLOCKED</text>
    <text x="128" y="138" fill="#9ca3af">by self-improving-hooks:</text>

    <text x="40" y="166" fill="#fca5a5">Command uses --no-verify / --no-gpg-sign /</text>
    <text x="40" y="186" fill="#fca5a5">commit.gpgsign=false.</text>

    <text x="40" y="218" fill="#9ca3af">Default policy:</text>
    <text x="158" y="218" fill="#e5e7eb">never skip hooks or signing</text>
    <text x="40" y="238" fill="#e5e7eb">without explicit user instruction.</text>

    <text x="40" y="270" fill="#9ca3af">Bypass once:</text>
    <text x="140" y="270" fill="#06b6d4">ALLOW_NO_VERIFY=1</text>

    <text x="40" y="290" fill="#9ca3af">Disable all:</text>
    <text x="140" y="290" fill="#06b6d4">SELF_IMPROVING_AGENTS_DISABLED=1</text>

    <rect x="40" y="306" width="820" height="2" fill="#374151"/>

    <text x="40" y="338" fill="#9ca3af" font-style="italic">— git was never invoked —</text>

    <!-- ready for next command -->
    <text x="40" y="380" fill="#06b6d4" font-weight="600">$</text>
    <text x="60" y="380" fill="#e5e7eb">_</text>

    <!-- blinking cursor effect (subtle pulse via opacity animation) -->
    <rect x="60" y="368" width="9" height="16" fill="#06b6d4" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
