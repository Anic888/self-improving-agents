<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Self-Improving Agents — defensive automation for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- subtle accent line bottom -->
  <rect y="316" width="1200" height="4" fill="url(#accent)"/>

  <!-- shield emblem -->
  <g transform="translate(120,90)">
    <path d="M 70 0 L 140 25 L 140 75 Q 140 130 70 160 Q 0 130 0 75 L 0 25 Z"
          fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="3"/>
    <!-- inner circuit-style lines -->
    <g stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 40 60 L 70 60 L 70 90 L 100 90"/>
      <path d="M 40 100 L 60 100"/>
      <path d="M 80 60 L 100 60"/>
    </g>
    <circle cx="40" cy="60" r="3" fill="#06b6d4"/>
    <circle cx="100" cy="60" r="3" fill="#7c3aed"/>
    <circle cx="40" cy="100" r="3" fill="#06b6d4"/>
    <circle cx="60" cy="100" r="3" fill="#7c3aed"/>
    <circle cx="100" cy="90" r="3" fill="#06b6d4"/>
    <!-- checkmark -->
    <path d="M 55 115 L 70 130 L 100 95"
          fill="none" stroke="#a78bfa" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <g transform="translate(320,140)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Self-Improving Agents
    </text>
    <text x="0" y="44" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Defensive automation for Claude Code
    </text>
  </g>

  <!-- right-side badge cluster -->
  <g transform="translate(870,120)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace">
    <g>
      <rect x="0" y="0" width="240" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-size="14" fill="#94a3b8">platform</text>
      <text x="100" y="22" font-size="14" fill="#06b6d4" font-weight="600">macOS</text>
    </g>
    <g transform="translate(0,40)">
      <rect width="240" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-size="14" fill="#94a3b8">shell</text>
      <text x="100" y="22" font-size="14" fill="#a78bfa" font-weight="600">POSIX sh</text>
    </g>
    <g transform="translate(0,80)">
      <rect width="240" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-size="14" fill="#94a3b8">license</text>
      <text x="100" y="22" font-size="14" fill="#34d399" font-weight="600">MIT</text>
    </g>
  </g>
</svg>
